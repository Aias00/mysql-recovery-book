name: Real recovery laboratory
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 lab/run.py --evidence evidence/runtime.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mysql-recovery-runtime
          path: evidence/
